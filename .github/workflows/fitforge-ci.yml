name: FitForge CI

on:
  push:
    branches:
      - main
      - "fitforge-fixes-*"
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: fitforge-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply compatible dependency security fixes
        if: github.event_name == 'push'
        run: npm audit fix --package-lock-only || true

      - name: Reconcile npm lockfile
        run: npm install --package-lock-only

      - name: Commit dependency lockfile updates
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- package-lock.json package.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json package.json
          git commit -m "chore: update dependency security fixes"
          git push

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      - name: Unit tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
