<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>FitForge - Treino Personalizado</title>
    <meta name="description" content="FitForge: seu app de treino personalizado com plano de exercícios, dieta, composição corporal e acompanhamento de progresso." />
    <meta name="author" content="FitForge" />
    <meta name="theme-color" content="#0f1419" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="canonical" href="https://dynamic-exercise-pal.lovable.app" />

    <meta property="og:title" content="FitForge - Treino Personalizado" />
    <meta property="og:description" content="Plano de treino, dieta e acompanhamento de progresso personalizados." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://dynamic-exercise-pal.lovable.app" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="FitForge - Treino Personalizado" />
    <meta name="twitter:description" content="Plano de treino, dieta e acompanhamento de progresso personalizados." />
    <link rel="preload" as="image" href="/logo-splash.png" fetchpriority="high" />
    <style>
      /* Tela de abertura: aparece antes do app carregar e some quando ele monta. */
      html, body { margin: 0; background: #0f1419; }
      .splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #0f1419; font-family: system-ui, sans-serif; }
      .splash img { width: 128px; height: 128px; border-radius: 28px; box-shadow: 0 0 40px rgba(249,115,22,.35); animation: splash-pulse 1.6s ease-in-out infinite; }
      .splash h1 { margin: 0; color: #f97316; font-size: 34px; letter-spacing: 6px; font-weight: 800; }
      .splash p { margin: 0; color: #9ca3af; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; }
      .splash .bar { width: 140px; height: 3px; border-radius: 3px; background: #1f2937; overflow: hidden; }
      .splash .bar::after { content: ""; display: block; width: 40%; height: 100%; background: #f97316; animation: splash-bar 1.1s ease-in-out infinite; }
      @keyframes splash-pulse { 50% { transform: scale(1.05); } }
      @keyframes splash-bar { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
    </style>
  </head>

  <body>
    <div id="root"><div class="splash"><img src="/logo-splash.png" alt="FitForge" /><h1>FITFORGE</h1><p>Treino personalizado</p><div class="bar"></div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
